<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3efe6"><title>Offline · DU LL.B.</title><style>:root{--ink:#191814;--muted:#665f54;--paper:#fffdf7;--canvas:#f3efe6;--line:#d8cfbf;--accent:#164f46;--serif:ui-serif,Georgia,Cambria,"Times New Roman",serif;--sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html{font-family:var(--sans);background:var(--canvas);color:var(--ink)}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem;background:linear-gradient(180deg,#fffdf8,var(--canvas))}main{width:min(100%,680px);padding:1.4rem;border:1px solid var(--line);border-radius:20px;background:var(--paper);box-shadow:0 14px 38px rgba(45,35,21,.1)}span{color:#8d482d;font-size:.7rem;font-weight:850;letter-spacing:.12em;text-transform:uppercase}h1{font-family:var(--serif);font-size:clamp(2.2rem,10vw,4.2rem);font-weight:600;letter-spacing:-.05em;line-height:.98;margin:.5rem 0}p{color:var(--muted);line-height:1.65}a{display:inline-flex;margin-top:.6rem;padding:.7rem .9rem;border-radius:11px;background:var(--accent);color:white;text-decoration:none;font-weight:800}</style></head><body><main><span>Offline</span><h1>The network is unavailable.</h1><p>Pages already opened may still be available from the local cache. Reconnect to retrieve uncached judgments, case records and curriculum data.</p><a href="/llb/">Try the curriculum again</a></main></body></html>
