name: Publish validated LL.B. study library and case catalogue

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-site.yml"
      - "tools/publish_case_catalogue_v4.sh"
      - "tools/case-publisher.tar.xz"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: llb-site-v4-publisher
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build, validate, and publish the complete repaired site
        shell: bash
        run: bash tools/publish_case_catalogue_v4.sh

      - name: Upload deterministic validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llb-site-v4-build-${{ github.run_id }}
          path: ${{ runner.temp }}/llb-site-v4-evidence/
          if-no-files-found: error
          retention-days: 30
