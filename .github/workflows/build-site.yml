name: Publish complete case catalogue v8

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-site.yml"
      - "tools/publish_case_lite_v5.sh"
      - "tools/case-detail-compat.css"
      - "tools/sw-v4.js"
      - "tools/case-lite-publisher.tar.xz.b64.part*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: llb-case-v8-publisher
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate, apply presentation and cache repairs, validate, and publish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/publish_case_lite_v5.sh")
          text = path.read_text(encoding="utf-8")
          stale_fragments = (
              "subjects/lb-101/cases/index.html",
              "nodes/lb-101.m01.t01/index.html",
              "/llb/subjects/lb-101/cases/",
              "/llb/nodes/lb-101.m01.t01/",
          )
          lines = [line for line in text.splitlines() if not any(fragment in line for fragment in stale_fragments)]
          text = "\n".join(lines) + "\n"

          marker = 'assert (root / "deploy-marker.txt").read_text(encoding="utf-8").strip() == "LLB_CASE_LITE_V5"'
          dynamic_checks = "\n".join((
              'subject_casebooks = sorted(root.glob("subjects/*/cases/index.html"))',
              'node_pages = sorted(root.glob("nodes/*/index.html"))',
              'assert len(subject_casebooks) == stats["subjectsCovered"], (',
              '    "subjectCasebooks", len(subject_casebooks), stats["subjectsCovered"]',
              ')',
              'assert len(node_pages) >= 4337, ("nodePages", len(node_pages))',
          ))
          if dynamic_checks not in text:
              if marker not in text:
                  raise SystemExit("deploy-marker validation anchor was not found")
              text = text.replace(marker, marker + "\n\n" + dynamic_checks, 1)

          commands = "\n".join((
              'cat tools/case-detail-compat.css >> case.css',
              'cp tools/sw-v4.js sw.js',
          ))
          command_anchor = 'node --check case.js'
          if 'cp tools/sw-v4.js sw.js' not in text:
              if command_anchor not in text:
                  raise SystemExit("case.js validation anchor was not found")
              text = text.replace(command_anchor, commands + "\n" + command_anchor, 1)

          validation_anchor = 'assert len(node_pages) >= 4337, ("nodePages", len(node_pages))'
          extra_asserts = "\n".join((
              'assert "case-lite markup compatibility" in (root / "case.css").read_text(encoding="utf-8")',
              'assert "du-llb-cases-v4" in (root / "sw.js").read_text(encoding="utf-8")',
              'assert "networkFirst" in (root / "sw.js").read_text(encoding="utf-8")',
          ))
          if 'assert "du-llb-cases-v4"' not in text:
              if validation_anchor not in text:
                  raise SystemExit("dynamic validation anchor was not found")
              text = text.replace(validation_anchor, validation_anchor + "\n" + extra_asserts, 1)

          path.write_text(text, encoding="utf-8")
          PY
          bash tools/publish_case_lite_v5.sh

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llb-case-v8-${{ github.run_id }}
          path: ${{ runner.temp }}/llb-case-v5-evidence/
          if-no-files-found: error
          retention-days: 30
