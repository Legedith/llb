name: Publish complete case catalogue v5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-site.yml"
      - "tools/publish_case_lite_v5.sh"
      - "tools/case-lite-publisher.tar.xz.b64.part*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: llb-case-v5-publisher
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct, generate, validate, and publish
        shell: bash
        run: bash tools/publish_case_lite_v5.sh

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llb-case-v5-${{ github.run_id }}
          path: ${{ runner.temp }}/llb-case-v5-evidence/
          if-no-files-found: error
          retention-days: 30
