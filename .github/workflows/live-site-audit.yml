name: Live site audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/live-site-audit.yml"
      - ".github/live-audit-trigger"
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-site-audit.yml"
      - ".github/live-audit-trigger"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: External curl verification
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p live-audit/curl live-audit/screenshots
          cat > live-audit/targets.tsv <<'EOF'
          root	https://legedith.github.io/llb/
          cases	https://legedith.github.io/llb/cases/
          maneka	https://legedith.github.io/llb/cases/sc-1978-maneka-gandhi-v-union-of-india/
          review	https://legedith.github.io/llb/cases/review/
          styles	https://legedith.github.io/llb/styles.css
          case-css	https://legedith.github.io/llb/case.css
          app-js	https://legedith.github.io/llb/app.js
          case-js	https://legedith.github.io/llb/case.js
          sw	https://legedith.github.io/llb/sw.js
          offline	https://legedith.github.io/llb/offline.html
          missing	https://legedith.github.io/llb/definitely-missing-live-audit/
          EOF
          printf 'name\trequested\tcode\teffective\ttype\tbytes\ttime\tsha256\n' > live-audit/curl-summary.tsv
          while IFS=$'\t' read -r name url; do
            body="live-audit/curl/$name.body"
            metrics=$(curl -sS -L --compressed --connect-timeout 15 --max-time 60 \
              -A 'LLB-live-audit/2.0' -D "live-audit/curl/$name.headers.txt" -o "$body" \
              -w '%{http_code}\t%{url_effective}\t%{content_type}\t%{size_download}\t%{time_total}' "$url" \
              2>"live-audit/curl/$name.stderr.txt" || true)
            sha=$(sha256sum "$body" 2>/dev/null | awk '{print $1}')
            printf '%s\t%s\t%s\t%s\n' "$name" "$url" "$metrics" "$sha" >> live-audit/curl-summary.tsv
          done < live-audit/targets.tsv
          cat live-audit/curl-summary.tsv

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Render fresh mobile and desktop screenshots
        shell: bash
        run: |
          set -euo pipefail
          cat > live-audit/render.mjs <<'EOF'
          import fs from 'node:fs/promises';
          import { chromium } from 'playwright';

          const targets = [
            ['root', 'https://legedith.github.io/llb/'],
            ['cases', 'https://legedith.github.io/llb/cases/'],
            ['maneka', 'https://legedith.github.io/llb/cases/sc-1978-maneka-gandhi-v-union-of-india/'],
            ['review', 'https://legedith.github.io/llb/cases/review/'],
            ['missing', 'https://legedith.github.io/llb/definitely-missing-live-audit/'],
          ];
          const sizes = [
            ['mobile', { width: 390, height: 844 }, true],
            ['desktop', { width: 1440, height: 1000 }, false],
          ];
          const browser = await chromium.launch({ headless: true });
          const report = [];
          for (const [size, viewport, isMobile] of sizes) {
            for (const [name, url] of targets) {
              const context = await browser.newContext({ viewport, isMobile, hasTouch: isMobile, serviceWorkers: 'block' });
              const page = await context.newPage();
              const failed = [];
              const bad = [];
              const consoleMessages = [];
              page.on('requestfailed', r => failed.push({ url: r.url(), error: r.failure()?.errorText || '' }));
              page.on('response', r => { if (r.status() >= 400) bad.push({ status: r.status(), url: r.url() }); });
              page.on('console', m => consoleMessages.push({ type: m.type(), text: m.text() }));
              let status = null;
              let error = '';
              try {
                const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
                status = response?.status() ?? null;
                await page.waitForLoadState('networkidle', { timeout: 15000 }).catch(() => {});
                await page.waitForTimeout(1200);
              } catch (e) { error = String(e); }
              const state = await page.evaluate(() => {
                const style = getComputedStyle(document.body);
                return {
                  title: document.title,
                  h1: document.querySelector('h1')?.textContent?.trim() || '',
                  textLength: document.body?.innerText?.length || 0,
                  font: style.fontFamily,
                  fontSize: style.fontSize,
                  background: style.backgroundColor,
                  color: style.color,
                  viewportWidth: innerWidth,
                  scrollWidth: document.documentElement.scrollWidth,
                  overflow: document.documentElement.scrollWidth > innerWidth + 2,
                  stylesheets: [...document.styleSheets].map(s => ({ href: s.href, rules: (() => { try { return s.cssRules.length; } catch { return null; } })() })),
                  scripts: [...document.scripts].map(s => s.src).filter(Boolean),
                };
              }).catch(e => ({ evaluateError: String(e) }));
              const screenshot = `live-audit/screenshots/${size}-${name}.png`;
              await page.screenshot({ path: screenshot, fullPage: true });
              report.push({ size, name, requested: url, finalUrl: page.url(), status, error, state, failed, bad, consoleMessages, screenshot });
              await context.close();
            }
          }
          await browser.close();
          await fs.writeFile('live-audit/browser-report.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report.map(x => ({ size: x.size, name: x.name, status: x.status, finalUrl: x.finalUrl, font: x.state.font, background: x.state.background, stylesheets: x.state.stylesheets, failed: x.failed, bad: x.bad, overflow: x.state.overflow })), null, 2));
          EOF
          node live-audit/render.mjs

      - name: Build concise audit report
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          base = Path('live-audit')
          rows = []
          p = base/'curl-summary.tsv'
          if p.exists():
              lines = p.read_text(encoding='utf-8').splitlines()
              keys = lines[0].split('\t')
              for line in lines[1:]:
                  vals = line.split('\t') + [''] * len(keys)
                  rows.append(dict(zip(keys, vals)))
          html = {}
          for name in ('root','cases','maneka','review','offline','missing'):
              f = base/'curl'/f'{name}.body'
              text = f.read_text(encoding='utf-8', errors='replace') if f.exists() else ''
              title = re.search(r'<title[^>]*>(.*?)</title>', text, re.I|re.S)
              html[name] = {
                  'title': title.group(1).strip() if title else '',
                  'stylesheets': re.findall(r'<link[^>]+href=["\']([^"\']+\.css[^"\']*)', text, re.I),
                  'scripts': re.findall(r'<script[^>]+src=["\']([^"\']+)', text, re.I),
                  'inlineStyle': '<style' in text.lower(),
                  'graph404': 'Skip to the knowledge graph' in text,
              }
          browser = json.loads((base/'browser-report.json').read_text()) if (base/'browser-report.json').exists() else []
          report = {'curl': rows, 'html': html, 'browser': browser}
          (base/'report.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          PY

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-site-audit-${{ github.run_id }}
          path: live-audit/
          if-no-files-found: error
          retention-days: 14
