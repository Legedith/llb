name: Live site audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-site-audit.yml"
      - ".github/live-audit-trigger"
  workflow_dispatch:
  page_build:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: live-site-audit
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Let the Pages CDN settle
        run: sleep 20

      - name: External curl verification
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p live-audit/curl live-audit/screenshots
          cat > live-audit/targets.tsv <<'EOF'
          root	https://legedith.github.io/llb/
          cases	https://legedith.github.io/llb/cases/
          maneka	https://legedith.github.io/llb/cases/sc-1978-maneka-gandhi-v-union-of-india/
          review	https://legedith.github.io/llb/cases/review/
          styles	https://legedith.github.io/llb/styles.css
          case-css	https://legedith.github.io/llb/case.css
          app-js	https://legedith.github.io/llb/app.js
          case-js	https://legedith.github.io/llb/case.js
          service-worker	https://legedith.github.io/llb/sw.js
          offline	https://legedith.github.io/llb/offline.html
          missing	https://legedith.github.io/llb/definitely-missing-live-audit/
          EOF
          printf 'name\trequested\tcode\teffective\ttype\tbytes\ttime\tsha256\n' > live-audit/curl-summary.tsv
          while IFS=$'\t' read -r name url; do
            [ -n "$name" ] || continue
            body="live-audit/curl/$name.body"
            metrics=$(curl -sS -L --compressed --retry 2 --retry-delay 2 \
              --connect-timeout 15 --max-time 60 \
              -A 'LLB-live-audit/4.0' \
              -D "live-audit/curl/$name.headers.txt" -o "$body" \
              -w '%{http_code}\t%{url_effective}\t%{content_type}\t%{size_download}\t%{time_total}' "$url" \
              2>"live-audit/curl/$name.stderr.txt" || true)
            sha=$(sha256sum "$body" 2>/dev/null | awk '{print $1}')
            printf '%s\t%s\t%s\t%s\n' "$name" "$url" "$metrics" "$sha" >> live-audit/curl-summary.tsv
          done < live-audit/targets.tsv
          cat live-audit/curl-summary.tsv

      - name: Use the runner's installed Chrome
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No system Chrome/Chromium was found" >&2
            exit 1
          fi
          echo "chrome=$CHROME" >> "$GITHUB_OUTPUT"
          "$CHROME" --version | tee live-audit/chrome-version.txt
          npm install --no-save --no-audit --no-fund playwright-core@1.52.0

      - name: Render mobile and desktop screenshots
        if: always() && steps.browser.outcome == 'success'
        shell: bash
        env:
          CHROME_BIN: ${{ steps.browser.outputs.chrome }}
        run: |
          set -euo pipefail
          cat > live-audit/render.mjs <<'EOF'
          import fs from 'node:fs/promises';
          import { chromium } from 'playwright-core';

          const targets = [
            ['root', 'https://legedith.github.io/llb/'],
            ['cases', 'https://legedith.github.io/llb/cases/'],
            ['maneka', 'https://legedith.github.io/llb/cases/sc-1978-maneka-gandhi-v-union-of-india/'],
            ['review', 'https://legedith.github.io/llb/cases/review/'],
            ['missing', 'https://legedith.github.io/llb/definitely-missing-live-audit/'],
          ];
          const sizes = [
            ['mobile', { width: 390, height: 844 }, true],
            ['desktop', { width: 1440, height: 1000 }, false],
          ];

          await fs.mkdir('live-audit/screenshots', { recursive: true });
          const browser = await chromium.launch({
            executablePath: process.env.CHROME_BIN,
            headless: true,
            args: ['--no-sandbox', '--disable-dev-shm-usage'],
          });
          const report = [];

          for (const [size, viewport, isMobile] of sizes) {
            for (const [name, url] of targets) {
              const context = await browser.newContext({
                viewport,
                isMobile,
                hasTouch: isMobile,
                serviceWorkers: 'block',
                ignoreHTTPSErrors: false,
              });
              const page = await context.newPage();
              const failed = [];
              const bad = [];
              const consoleMessages = [];
              const pageErrors = [];
              page.on('requestfailed', request => failed.push({ url: request.url(), error: request.failure()?.errorText || '' }));
              page.on('response', response => { if (response.status() >= 400) bad.push({ status: response.status(), url: response.url() }); });
              page.on('console', message => consoleMessages.push({ type: message.type(), text: message.text() }));
              page.on('pageerror', error => pageErrors.push(String(error)));

              let status = null;
              let error = '';
              try {
                const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
                status = response?.status() ?? null;
                await page.waitForLoadState('networkidle', { timeout: 15000 }).catch(() => {});
                await page.waitForTimeout(1200);
              } catch (exception) {
                error = String(exception);
              }

              const state = await page.evaluate(() => {
                const body = document.body;
                const style = getComputedStyle(body);
                const h1 = document.querySelector('h1');
                return {
                  title: document.title,
                  h1: h1?.textContent?.trim() || '',
                  textLength: body?.innerText?.length || 0,
                  htmlLength: body?.innerHTML?.length || 0,
                  font: style.fontFamily,
                  fontSize: style.fontSize,
                  background: style.backgroundColor,
                  color: style.color,
                  h1Font: h1 ? getComputedStyle(h1).fontFamily : '',
                  h1Size: h1 ? getComputedStyle(h1).fontSize : '',
                  viewportWidth: innerWidth,
                  scrollWidth: document.documentElement.scrollWidth,
                  overflow: document.documentElement.scrollWidth > innerWidth + 2,
                  stylesheets: [...document.styleSheets].map(sheet => ({
                    href: sheet.href,
                    rules: (() => { try { return sheet.cssRules.length; } catch { return null; } })(),
                  })),
                  scripts: [...document.scripts].map(script => script.src).filter(Boolean),
                  bodyClass: body?.className || '',
                  graph404: body?.innerText?.includes('Skip to the knowledge graph') || false,
                };
              }).catch(exception => ({ evaluateError: String(exception) }));

              const screenshot = `live-audit/screenshots/${size}-${name}.png`;
              await page.screenshot({ path: screenshot, fullPage: true });
              await fs.writeFile(`live-audit/screenshots/${size}-${name}.html`, await page.content());
              report.push({
                size, name, requested: url, finalUrl: page.url(), status, error,
                state, failed, bad, consoleMessages, pageErrors, screenshot,
              });
              await context.close();
            }
          }

          await browser.close();
          await fs.writeFile('live-audit/browser-report.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report.map(item => ({
            size: item.size,
            name: item.name,
            status: item.status,
            finalUrl: item.finalUrl,
            title: item.state.title,
            h1: item.state.h1,
            font: item.state.font,
            background: item.state.background,
            stylesheets: item.state.stylesheets,
            failed: item.failed,
            bad: item.bad,
            overflow: item.state.overflow,
            graph404: item.state.graph404,
          })), null, 2));
          EOF
          node live-audit/render.mjs

      - name: Build concise report
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          base = Path('live-audit')
          rows = []
          table = base/'curl-summary.tsv'
          if table.exists():
              lines = table.read_text(encoding='utf-8').splitlines()
              keys = lines[0].split('\t')
              for line in lines[1:]:
                  values = line.split('\t')
                  values += [''] * max(0, len(keys) - len(values))
                  rows.append(dict(zip(keys, values)))

          html = {}
          for name in ('root', 'cases', 'maneka', 'review', 'offline', 'missing'):
              file = base/'curl'/f'{name}.body'
              text = file.read_text(encoding='utf-8', errors='replace') if file.exists() else ''
              title = re.search(r'<title[^>]*>(.*?)</title>', text, re.I | re.S)
              html[name] = {
                  'title': title.group(1).strip() if title else '',
                  'stylesheets': re.findall(r'<link[^>]+href=["\']([^"\']+\.css[^"\']*)', text, re.I),
                  'scripts': re.findall(r'<script[^>]+src=["\']([^"\']+)', text, re.I),
                  'inlineStyle': '<style' in text.lower(),
                  'graph404': 'Skip to the knowledge graph' in text,
              }

          browser_file = base/'browser-report.json'
          browser = json.loads(browser_file.read_text(encoding='utf-8')) if browser_file.exists() else []
          report = {'curl': rows, 'html': html, 'browser': browser}
          (base/'report.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          print(json.dumps({'curl': rows, 'html': html}, indent=2))
          PY

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-site-audit-${{ github.run_id }}
          path: live-audit/
          if-no-files-found: error
          retention-days: 14

      - name: Fail when required public routes or assets are broken
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('live-audit/report.json').read_text(encoding='utf-8'))
          curl = {row['name']: row for row in report['curl']}
          required_200 = ['root', 'cases', 'maneka', 'review', 'styles', 'case-css', 'app-js', 'case-js', 'service-worker', 'offline']
          failures = []
          for name in required_200:
              if curl.get(name, {}).get('code') != '200':
                  failures.append(f'{name}: HTTP {curl.get(name, {}).get("code", "missing")}')
          if curl.get('missing', {}).get('code') != '404':
              failures.append(f'missing route: expected 404, got {curl.get("missing", {}).get("code", "missing")}')

          for item in report.get('browser', []):
              if item['name'] != 'missing' and item.get('status') != 200:
                  failures.append(f'{item["size"]}/{item["name"]}: browser HTTP {item.get("status")}')
              if item['name'] != 'missing' and not item.get('state', {}).get('stylesheets'):
                  failures.append(f'{item["size"]}/{item["name"]}: no loaded stylesheet')
              if item.get('state', {}).get('overflow'):
                  failures.append(f'{item["size"]}/{item["name"]}: horizontal overflow')
              if item['name'] != 'missing' and item.get('state', {}).get('graph404'):
                  failures.append(f'{item["size"]}/{item["name"]}: graph 404 content served')

          if failures:
              print('\n'.join(failures))
              raise SystemExit(1)
          print('All required public routes, assets, and rendered pages passed.')
          PY
