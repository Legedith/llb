name: Export LL.B. audit data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-audit-data.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package a clean generator test root
        run: |
          set -euo pipefail
          mkdir -p audit-export/site-root
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='nodes/' \
            --exclude='tools/enrich_nodes.py.xz.b64.part*' \
            ./ audit-export/site-root/
          cp tools/enrich_nodes.py audit-export/current-enrich_nodes.py
      - uses: actions/upload-artifact@v4
        with:
          name: llb-test-root
          path: audit-export/
          retention-days: 1
