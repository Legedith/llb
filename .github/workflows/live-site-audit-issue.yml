name: Issue-triggered live-site evidence

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.title, '[live-site-audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: External curl audit
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p live-audit/curl live-audit/screenshots
          cat > live-audit/targets.tsv <<'EOF'
          root	https://legedith.github.io/llb/
          cases	https://legedith.github.io/llb/cases/
          maneka	https://legedith.github.io/llb/cases/sc-1978-maneka-gandhi-v-union-of-india/
          review	https://legedith.github.io/llb/cases/review/
          styles	https://legedith.github.io/llb/styles.css
          case-css	https://legedith.github.io/llb/case.css
          app-js	https://legedith.github.io/llb/app.js
          case-js	https://legedith.github.io/llb/case.js
          service-worker	https://legedith.github.io/llb/sw.js
          offline	https://legedith.github.io/llb/offline.html
          missing	https://legedith.github.io/llb/definitely-missing-live-audit/
          EOF
          printf 'name\trequested\tcode\teffective\ttype\tbytes\ttime\tsha256\n' > live-audit/curl-summary.tsv
          while IFS=$'\t' read -r name url; do
            body="live-audit/curl/$name.body"
            metrics=$(curl -sS -L --compressed --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 60 \
              -A 'LLB-external-evidence/3.0' -D "live-audit/curl/$name.headers.txt" -o "$body" \
              -w '%{http_code}\t%{url_effective}\t%{content_type}\t%{size_download}\t%{time_total}' "$url" \
              2>"live-audit/curl/$name.stderr.txt" || true)
            sha=$(sha256sum "$body" 2>/dev/null | awk '{print $1}')
            printf '%s\t%s\t%s\t%s\n' "$name" "$url" "$metrics" "$sha" >> live-audit/curl-summary.tsv
          done < live-audit/targets.tsv
          cat live-audit/curl-summary.tsv

      - name: Prepare system Chrome
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "chrome=$CHROME" >> "$GITHUB_OUTPUT"
          "$CHROME" --version | tee live-audit/chrome-version.txt
          npm install --no-save --no-audit --no-fund playwright-core@1.52.0

      - name: Render mobile and desktop screenshots
        shell: bash
        env:
          CHROME_BIN: ${{ steps.browser.outputs.chrome }}
        run: |
          set -euo pipefail
          cat > live-audit/render.mjs <<'EOF'
          import fs from 'node:fs/promises';
          import { chromium } from 'playwright-core';

          const targets = [
            ['root', 'https://legedith.github.io/llb/'],
            ['cases', 'https://legedith.github.io/llb/cases/'],
            ['maneka', 'https://legedith.github.io/llb/cases/sc-1978-maneka-gandhi-v-union-of-india/'],
            ['review', 'https://legedith.github.io/llb/cases/review/'],
            ['missing', 'https://legedith.github.io/llb/definitely-missing-live-audit/'],
          ];
          const sizes = [
            ['mobile', { width: 390, height: 844 }, true],
            ['desktop', { width: 1440, height: 1000 }, false],
          ];
          const browser = await chromium.launch({
            executablePath: process.env.CHROME_BIN,
            headless: true,
            args: ['--no-sandbox', '--disable-dev-shm-usage'],
          });
          const report = [];
          for (const [size, viewport, isMobile] of sizes) {
            for (const [name, requested] of targets) {
              const context = await browser.newContext({ viewport, isMobile, hasTouch: isMobile, serviceWorkers: 'block' });
              const page = await context.newPage();
              const failed = [], bad = [], pageErrors = [];
              page.on('requestfailed', request => failed.push({ url: request.url(), error: request.failure()?.errorText || '' }));
              page.on('response', response => { if (response.status() >= 400) bad.push({ status: response.status(), url: response.url() }); });
              page.on('pageerror', error => pageErrors.push(String(error)));
              let status = null, error = '';
              try {
                const response = await page.goto(requested, { waitUntil: 'domcontentloaded', timeout: 60000 });
                status = response?.status() ?? null;
                await page.waitForLoadState('networkidle', { timeout: 15000 }).catch(() => {});
                await page.waitForTimeout(1200);
              } catch (exception) {
                error = String(exception);
              }
              const state = await page.evaluate(() => {
                const body = document.body;
                const h1 = document.querySelector('h1');
                const actions = document.querySelector('.case-actions');
                const actionButton = actions?.querySelector('button');
                return {
                  title: document.title,
                  h1: h1?.textContent?.trim() || '',
                  viewportWidth: innerWidth,
                  scrollWidth: document.documentElement.scrollWidth,
                  overflow: document.documentElement.scrollWidth > innerWidth + 2,
                  stylesheets: [...document.styleSheets].map(sheet => ({
                    href: sheet.href,
                    rules: (() => { try { return sheet.cssRules.length; } catch { return null; } })(),
                  })),
                  containsSkipLink: body?.innerText?.includes('Skip to the knowledge graph') || false,
                  caseActions: actions ? getComputedStyle(actions).display : '',
                  actionButtonRadius: actionButton ? getComputedStyle(actionButton).borderRadius : '',
                  propositionCards: document.querySelectorAll('.node-case-link').length,
                  resultCards: document.querySelectorAll('.case-card').length,
                  reviewCards: document.querySelectorAll('.review-item, .review-card').length,
                  inlineStyles: [...document.styleSheets].some(sheet => !sheet.href),
                };
              });
              const screenshot = `live-audit/screenshots/${size}-${name}.png`;
              await page.screenshot({ path: screenshot, fullPage: true });
              await fs.writeFile(`live-audit/screenshots/${size}-${name}.html`, await page.content());
              report.push({ size, name, requested, finalUrl: page.url(), status, error, state, failed, bad, pageErrors, screenshot });
              await context.close();
            }
          }
          await browser.close();
          await fs.writeFile('live-audit/browser-report.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report.map(item => ({
            size: item.size,
            name: item.name,
            status: item.status,
            title: item.state.title,
            h1: item.state.h1,
            stylesheets: item.state.stylesheets,
            overflow: item.state.overflow,
            caseActions: item.state.caseActions,
            actionButtonRadius: item.state.actionButtonRadius,
            propositionCards: item.state.propositionCards,
            failed: item.failed,
            pageErrors: item.pageErrors,
          })), null, 2));
          EOF
          node live-audit/render.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-live-site-evidence-${{ github.run_id }}
          path: live-audit/
          if-no-files-found: error
          retention-days: 14

      - name: Verify routes, assets, layouts, and cache policy
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          base = Path('live-audit')
          lines = (base/'curl-summary.tsv').read_text(encoding='utf-8').splitlines()
          keys = lines[0].split('\t')
          curl = {}
          for line in lines[1:]:
              values = line.split('\t')
              row = dict(zip(keys, values))
              curl[row['name']] = row

          failures = []
          for name in ['root','cases','maneka','review','styles','case-css','app-js','case-js','service-worker','offline']:
              if curl.get(name, {}).get('code') != '200':
                  failures.append(f'{name}: HTTP {curl.get(name, {}).get("code", "missing")}')
          if curl.get('missing', {}).get('code') != '404':
              failures.append(f'missing: HTTP {curl.get("missing", {}).get("code", "missing")}')

          sw = (base/'curl/service-worker.body').read_text(encoding='utf-8', errors='replace')
          if 'du-llb-cases-v4' not in sw: failures.append('service worker: cache v4 missing')
          if 'networkFirst' not in sw: failures.append('service worker: network-first asset policy missing')

          browser = json.loads((base/'browser-report.json').read_text(encoding='utf-8'))
          for item in browser:
              name, size, state = item['name'], item['size'], item['state']
              expected = 404 if name == 'missing' else 200
              if item.get('status') != expected: failures.append(f'{size}/{name}: HTTP {item.get("status")}')
              if name != 'missing' and not state.get('stylesheets'): failures.append(f'{size}/{name}: no stylesheet')
              if state.get('overflow'): failures.append(f'{size}/{name}: horizontal overflow')
              if item.get('failed'): failures.append(f'{size}/{name}: failed requests')
              if item.get('pageErrors'): failures.append(f'{size}/{name}: page errors')
              if name in ('cases','maneka','review') and state.get('containsSkipLink'):
                  failures.append(f'{size}/{name}: legacy graph-shaped 404 body')
              if name == 'maneka':
                  if state.get('caseActions') != 'grid': failures.append(f'{size}/maneka: action panel is not styled as a grid')
                  if state.get('actionButtonRadius') in ('', '0px'): failures.append(f'{size}/maneka: native unstyled action button')
                  if state.get('propositionCards', 0) < 4: failures.append(f'{size}/maneka: proposition cards missing')
              if name == 'missing':
                  if not state.get('title', '').startswith('Page not found'): failures.append(f'{size}/missing: wrong 404 page')
                  if not state.get('inlineStyles'): failures.append(f'{size}/missing: route-safe inline styles missing')

          if failures:
              print('\n'.join(failures))
              raise SystemExit(1)
          print('External live-site audit passed.')
          PY
